[package]
name = "dialogger-rs"
version = "0.1.1"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust branching dialogue graph evaluator and NPC bark engine from Dialogger"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/dialogger-rs"
keywords = ["dialogue", "gamedev", "dialogger", "narrative", "npc-bark"]
categories = ["game-development", "parser-implementations"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
